<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Food Chain Magnate — Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#f5f0e4;--cream2:#ede8d8;--cream3:#d8d0bc;--cream4:#ccc4ac;
  --dark:#1a1a1a;--dark2:#252525;--red:#b02020;--red2:#d03030;
  --blk-bg:#1e1e1e;--blk-bd:#3a3a3a;--blk-tx:#f0ece0;--blk-sx:rgba(240,236,224,.5);
  --sal-bg:#e8b8a8;--sal-bd:#c07060;--sal-tx:#3a1008;
  --grn-bg:#8ab870;--grn-bd:#6a9850;--grn-tx:#0e2808;
  --lgrn-bg:#b8dcb0;--lgrn-bd:#7aaa70;--lgrn-tx:#0a2808;
  --blu-bg:#90b8d8;--blu-bd:#6090b8;--blu-tx:#081828;
  --lblu-bg:#c0d8f0;--lblu-bd:#7aaad0;--lblu-tx:#081828;
  --pur-bg:#b088d8;--pur-bd:#7040b8;--pur-tx:#1a0a30;
  --gry-bg:#b0b0b8;--gry-bd:#888898;--gry-tx:#101018;
  --red-bg:#c83030;--red-bd:#a02020;--red-tx:#fff0f0;
}
html,body{background:var(--cream);color:var(--dark);font-family:'Source Sans 3',sans-serif;min-height:100vh}
.app{max-width:600px;margin:0 auto;padding:0 0 80px}

/* TOPBAR */
.topbar{background:var(--dark);padding:10px 14px;position:sticky;top:0;z-index:50}
.topbar-row1{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.logo{font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;color:#f0ece0;letter-spacing:.07em;flex:1}
.logo span{color:#e05050}
.tpill{background:var(--red);color:#fff;font-size:11px;font-weight:600;font-family:'Oswald',sans-serif;padding:4px 11px;border-radius:3px;letter-spacing:.06em;white-space:nowrap}
.topbar-row2{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:10px;padding:3px 9px;border-radius:3px;border:1px solid #444;color:#aaa;background:#2a2a2a;white-space:nowrap}
.chip.hl{border-color:#9878c0;color:#c8a8e8;background:rgba(152,120,192,.18)}
.topbar-row3{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.tbtn{padding:6px 12px;border:1px solid #444;border-radius:5px;font-size:11px;font-family:'Oswald',sans-serif;letter-spacing:.05em;cursor:pointer;background:#2a2a2a;color:#aaa;transition:all .12s;flex:1;min-width:70px;text-align:center}
.tbtn:active{background:#3a3a3a;color:#eee}
.tbtn:disabled{opacity:.3;cursor:not-allowed}
.tbtn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.tbtn.primary:active{background:var(--red2)}
.tbtn.warn{border-color:#a06000;color:#c08000;background:rgba(160,100,0,.15)}

/* HIST */
.hist-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 14px;background:var(--cream2);border-bottom:1px solid var(--cream3)}
.hlbl{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:.1em;font-family:'Oswald',sans-serif}
.hbtn{padding:4px 12px;border:1px solid var(--cream3);border-radius:3px;font-size:11px;font-family:'Oswald',sans-serif;cursor:pointer;background:#fff;color:#777}
.hbtn.cur{background:var(--dark);color:#fff;border-color:var(--dark)}
.hbtn.past{background:#d0e0f0;color:#1a3a6a;border-color:#6090b8}

/* PANELS */
.panel{background:#fff;border-bottom:1.5px solid var(--cream3);padding:14px}
.panel+.panel{border-top:none}
.ptitle{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.pbar{width:18px;height:3px;border-radius:2px;background:var(--red);flex-shrink:0}

/* VIEW NOTICE */
.view-notice{background:#d8eaf8;border-bottom:1px solid #6090b8;padding:8px 14px;font-size:11px;color:#1a3a6a;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mbtn-sm{padding:4px 10px;border:1px solid #6090b8;border-radius:4px;font-size:10px;font-family:'Oswald',sans-serif;cursor:pointer;background:var(--dark);color:#fff}

/* CEO */
.ceo-card{background:var(--dark);border:2px solid #3a3a3a;border-radius:9px;padding:10px 20px;text-align:center;font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;color:#f0ece0;letter-spacing:.08em;margin:0 auto 10px;max-width:200px}
.ceo-sub{font-family:'Source Sans 3',sans-serif;font-size:9px;color:rgba(240,236,224,.4);margin-top:2px}
.ceo-arr{font-size:10px;color:#bbb;text-align:center;margin-bottom:8px}

/* SLOTS */
.slots-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.slot{width:80px;min-height:72px;border:1.5px dashed var(--cream3);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:4px;position:relative;background:var(--cream2)}
.slot.filled{border-style:solid;border-color:#ccc;background:#fff}
.slot.removable{cursor:pointer}
.slot.removable:active{border-color:var(--red2);background:#fff5f5}
.slot-lbl{font-size:9px;color:#bbb;text-align:center;font-family:'Oswald',sans-serif}
.rmx{position:absolute;top:3px;right:5px;font-size:12px;color:var(--red2);display:none;font-weight:700;line-height:1}
.slot.removable:hover .rmx{display:block}

/* MGR */
.mgr-box{border:1px solid var(--cream3);border-radius:9px;padding:8px 10px;margin-bottom:8px;background:var(--cream2)}
.mgr-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.mgr-info{font-size:9px;color:#999;font-family:'Oswald',sans-serif}
.mgr-slots{display:flex;gap:6px;flex-wrap:wrap}

/* ECARD */
.ecard{width:100%;border-radius:6px;padding:5px 5px;text-align:center;border:1.5px solid transparent}
.ename{font-size:9px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.05em;line-height:1.3;text-transform:uppercase}
.esub{font-size:7px;line-height:1.3;margin-top:2px}
.c-blk{background:var(--blk-bg);border-color:var(--blk-bd);color:var(--blk-tx)}.c-blk .esub{color:var(--blk-sx)}
.c-sal{background:var(--sal-bg);border-color:var(--sal-bd);color:var(--sal-tx)}
.c-grn{background:var(--grn-bg);border-color:var(--grn-bd);color:var(--grn-tx)}
.c-lgrn{background:var(--lgrn-bg);border-color:var(--lgrn-bd);color:var(--lgrn-tx)}
.c-blu{background:var(--blu-bg);border-color:var(--blu-bd);color:var(--blu-tx)}
.c-lblu{background:var(--lblu-bg);border-color:var(--lblu-bd);color:var(--lblu-tx)}
.c-pur{background:var(--pur-bg);border-color:var(--pur-bd);color:var(--pur-tx)}
.c-gry{background:var(--gry-bg);border-color:var(--gry-bd);color:var(--gry-tx)}
.c-red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red-tx)}

/* BEACH */
.beach-wrap{display:flex;gap:7px;flex-wrap:wrap;min-height:40px}
.bc{border-radius:8px;padding:8px 9px;font-family:'Oswald',sans-serif;text-align:center;border:1.5px solid transparent;display:flex;flex-direction:column;gap:3px;min-width:90px;cursor:default}
.bc-name{font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.bc-sub{font-size:8px;opacity:.8;font-family:'Source Sans 3',sans-serif;text-transform:none;font-weight:400}
.bc-btns{display:flex;gap:4px;margin-top:5px;justify-content:center}
.bc-btn{padding:4px 9px;font-size:9px;font-family:'Oswald',sans-serif;cursor:pointer;border:1px solid rgba(0,0,0,.2);border-radius:4px;background:rgba(255,255,255,.38);color:inherit;transition:background .1s;min-height:32px}
.bc-btn:active{background:rgba(255,255,255,.6)}
.bc-btn.act{background:rgba(0,0,0,.2)}

/* TRAIN POPUP */
.train-popup{background:#fff;border:1.5px solid var(--cream3);border-radius:9px;padding:12px;margin-top:9px;box-shadow:0 4px 18px rgba(0,0,0,.1)}
.tp-title{font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;margin-bottom:8px;color:var(--dark)}
.tp-grid{display:flex;gap:7px;flex-wrap:wrap}
.tp-card{border-radius:8px;padding:9px 10px;cursor:pointer;text-align:center;min-width:90px;border:1.5px solid transparent;flex:1}
.tp-card:active{filter:brightness(1.08)}
.tp-name{font-family:'Oswald',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;line-height:1.25}
.tp-desc{font-size:8px;opacity:.8;margin-top:2px}
.tp-close{margin-top:9px;padding:6px 14px;border:1px solid var(--cream3);border-radius:5px;font-size:10px;font-family:'Oswald',sans-serif;cursor:pointer;background:var(--cream2);color:#777;display:block;width:100%;text-align:center}

/* HIRE */
.hire-open-btn{width:100%;padding:12px;border:1.5px solid var(--cream4);border-radius:7px;font-size:12px;font-family:'Oswald',sans-serif;letter-spacing:.07em;cursor:pointer;background:var(--cream2);color:#555;display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px}
.hire-open-btn .dot{width:9px;height:9px;border-radius:50%;background:var(--grn-bd);flex-shrink:0}
.hire-open-btn.open{background:var(--dark);color:#f0ece0;border-color:var(--dark)}
.hire-open-btn.open .dot{background:#8ab870}
.hire-panel{background:var(--cream2);border:1.5px solid var(--cream3);border-radius:8px;padding:10px;margin-top:8px}
.hire-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}
.hcard{border-radius:8px;padding:10px 9px;border:1.5px solid transparent}
.hcard:active{filter:brightness(1.06)}
.hc-tag{display:inline-block;font-size:8px;padding:2px 6px;border-radius:2px;margin-bottom:4px;font-family:'Oswald',sans-serif;text-transform:uppercase;background:rgba(0,0,0,.14);color:inherit;opacity:.8}
.hc-name{font-family:'Oswald',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;line-height:1.25;margin-bottom:3px}
.hc-desc{font-size:9px;line-height:1.4;opacity:.85}
.hc-train{font-size:8px;opacity:.6;margin-top:3px;font-style:italic}
.hc-btn{margin-top:8px;width:100%;padding:8px;border:1px solid rgba(0,0,0,.2);border-radius:5px;font-size:10px;font-family:'Oswald',sans-serif;cursor:pointer;background:rgba(0,0,0,.15);color:inherit;min-height:40px}
.hc-btn:active{background:rgba(0,0,0,.28)}

/* MILESTONE */
.ms-group{margin-bottom:12px}
.ms-group-label{font-family:'Oswald',sans-serif;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px;padding:3px 8px;border-radius:3px;display:inline-block}
.ms-grid{display:flex;gap:6px;flex-wrap:wrap}
.ms-card{border-radius:7px;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:7px;border:1.5px solid transparent;min-height:44px}
.ms-card:active{filter:brightness(1.06)}
.ms-check{width:20px;height:20px;border-radius:4px;border:1.5px solid rgba(0,0,0,.25);background:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;font-weight:700}
.ms-card.checked .ms-check{background:rgba(0,0,0,.25)}
.ms-name{font-family:'Oswald',sans-serif;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1.3}
.ms-effect{font-size:8px;opacity:.75;margin-top:2px;font-family:'Source Sans 3',sans-serif}
.ms-blu{background:var(--blu-bg);border-color:var(--blu-bd);color:var(--blu-tx)}
.ms-grn{background:var(--grn-bg);border-color:var(--grn-bd);color:var(--grn-tx)}
.ms-red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red-tx)}
.ms-gry{background:var(--gry-bg);border-color:var(--gry-bd);color:var(--gry-tx)}
.ms-pur{background:var(--pur-bg);border-color:var(--pur-bd);color:var(--pur-tx)}
.ms-blk{background:var(--blk-bg);border-color:var(--blk-bd);color:var(--blk-tx)}
.ms-card.house-built.checked{box-shadow:0 0 0 2px #9878c0}

/* LOG */
.log-wrap{border-top:1px solid var(--cream3);padding-top:8px;margin-top:8px}
.log-item{font-size:10px;color:#888;padding:3px 0;border-bottom:1px solid var(--cream3);font-family:'Source Sans 3',sans-serif}
.log-item:last-child{border-bottom:none}
.sep{font-size:8px;color:#aaa;margin:5px 0 2px;line-height:1.5}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:0}
.modal{background:#fff;border-radius:14px 14px 0 0;padding:20px 18px;width:100%;max-width:600px}
.modal h3{font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;margin-bottom:7px;text-transform:uppercase}
.modal p{font-size:12px;color:#666;line-height:1.6;margin-bottom:14px}
.mact{display:flex;gap:8px;justify-content:flex-end}
.mbtn{padding:8px 16px;border:1px solid var(--cream3);border-radius:6px;font-size:11px;font-family:'Oswald',sans-serif;cursor:pointer;background:var(--cream2);color:#777;min-height:44px}
.mbtn.dk{background:var(--dark);color:#fff;border-color:var(--dark)}
</style>
</head>
<body>
<div class="app" id="app">

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-row1">
    <div class="logo">FOOD CHAIN <span>MAGNATE</span></div>
    <div class="tpill" id="tlabel">TURN 1</div>
  </div>
  <div class="topbar-row2">
    <div class="chip" id="c-slots">SLOTS 3</div>
    <div class="chip" id="c-beach">BEACH 0</div>
    <div class="chip" id="c-train">TRAIN 0</div>
    <div class="chip" id="c-recruit">RECRUIT 1</div>
    <div class="chip" id="c-house">HOUSE —</div>
  </div>
  <div class="topbar-row3">
    <button class="tbtn" id="btn-undo" onclick="doUndo()" disabled>↩ UNDO</button>
    <button class="tbtn warn" id="btn-rt" onclick="resetTurn()">↺ RESET TURN</button>
    <button class="tbtn primary" id="btn-next" onclick="nextTurn()">NEXT TURN →</button>
    <button class="tbtn" onclick="resetGame()">RESET ALL</button>
  </div>
</div>

<!-- HISTORY -->
<div class="hist-bar" id="hist-bar"><span class="hlbl">Turn:</span></div>

<!-- VIEW NOTICE -->
<div id="view-notice" style="display:none"></div>

<!-- CORPORATE STRUCTURE -->
<div class="panel" id="interact-wrap">
  <div class="ptitle"><span class="pbar"></span>CORPORATE STRUCTURE</div>
  <div class="ceo-card">CEO — YOU<div class="ceo-sub">3 SLOTS · RECRUIT 1</div></div>
  <div class="ceo-arr">▼</div>
  <div class="slots-row" id="ceo-row"></div>
  <div id="mgr-area"></div>
  <div class="sep">CEO รับ 3 การ์ด — แตะการ์ดค้างเพื่อนำกลับ Beach</div>
</div>

<!-- AT THE BEACH + HIRE -->
<div class="panel">
  <div class="ptitle"><span class="pbar" style="background:var(--lgrn-bd)"></span>AT THE BEACH</div>
  <div class="beach-wrap" id="beach-area"></div>
  <div id="train-popup-area"></div>

  <div style="margin-top:14px;border-top:1px solid var(--cream3);padding-top:12px">
    <div class="ptitle"><span class="pbar" style="background:var(--grn-bd)"></span>HIRE</div>
    <button class="hire-open-btn" id="hire-open-btn" onclick="toggleHire()">
      <span class="dot"></span><span id="hire-btn-lbl">เลือกการ์ดที่ต้องการ Hire ▾</span>
    </button>
    <div id="hire-panel-area"></div>
  </div>

  <div class="log-wrap">
    <div class="ptitle" style="margin-bottom:4px"><span class="pbar" style="background:#bbb"></span>LOG</div>
    <div id="log-area"></div>
  </div>
</div>

<!-- MILESTONES -->
<div class="panel">
  <div class="ptitle"><span class="pbar" style="background:#9878c0"></span>MILESTONES — แตะเพื่อติ๊ก ✓ / ✗</div>
  <div style="font-size:9px;color:#888;margin-bottom:10px;font-family:'Source Sans 3',sans-serif">★ First House Built ✓ = ปลดล็อก Train ซ้ำคนเดิมได้ในรอบเดียว</div>
  <div id="ms-render"></div>
</div>

<!-- MODAL -->
<div id="mc"></div>

</div><!-- end .app -->

<script>
const CEO_SLOTS=3;

const MILESTONES=[
  {id:'ms_mkt1',   name:'First Marketeer Used',       cls:'ms-blu',effect:'★ รับ Kitchen Trainee + Errand Boy'},
  {id:'ms_mkt2',   name:'First Mkt Trainee Used',     cls:'ms-blu',effect:''},
  {id:'ms_mkt3',   name:'First Campaign Mgr Used',    cls:'ms-blu',effect:''},
  {id:'ms_mkt4',   name:'First Brand Mgr Used',       cls:'ms-blu',effect:''},
  {id:'ms_mkt5',   name:'First Brand Director Used',  cls:'ms-blu',effect:''},
  {id:'ms_mkt6',   name:'First Rural Mkteer Used',    cls:'ms-blu',effect:''},
  {id:'ms_ops1',   name:'First Cart Operator Used',   cls:'ms-grn',effect:''},
  {id:'ms_ops2',   name:'First Burger Sold',          cls:'ms-grn',effect:''},
  {id:'ms_ops3',   name:'First Pizza Sold',           cls:'ms-grn',effect:''},
  {id:'ms_ops4',   name:'First Lemonade Sold',        cls:'ms-grn',effect:''},
  {id:'ms_ops5',   name:'First Beer Sold',            cls:'ms-grn',effect:''},
  {id:'ms_ops6',   name:'First Coke Sold',            cls:'ms-grn',effect:''},
  {id:'ms_ops7',   name:'First Coffee Sold',          cls:'ms-grn',effect:''},
  {id:'ms_hr1',    name:'First Discount Mgr Used',    cls:'ms-red',effect:''},
  {id:'ms_hr2',    name:'First New Restaurant',       cls:'ms-red',effect:''},
  {id:'ms_hr3',    name:'First Recruiting Girl Used', cls:'ms-gry',effect:'★ รับ Exec VP 1 ใบ'},
  {id:'ms_hr4',    name:'First Trainer Used',         cls:'ms-gry',effect:'★ รับ Trainer 1 ใบ'},
  {id:'ms_pur1',   name:'First Waitress Used',        cls:'ms-pur',effect:''},
  {id:'ms_house',  name:'First House Built',          cls:'ms-pur',effect:'★ Train ซ้ำคนเดิมได้',special:'house'},
  {id:'ms_lob',    name:'First Lobbyist Used',        cls:'ms-pur',effect:''},
  {id:'ms_demand', name:'Someone Sells "Your" Demand',cls:'ms-blk',effect:''},
];

const MS_GROUPS=[
  {label:'Marketing',    color:'#6090b8', ids:['ms_mkt1','ms_mkt2','ms_mkt3','ms_mkt4','ms_mkt5','ms_mkt6']},
  {label:'Operations',   color:'#6a9850', ids:['ms_ops1','ms_ops2','ms_ops3','ms_ops4','ms_ops5','ms_ops6','ms_ops7']},
  {label:'HR / Business',color:'#a02020', ids:['ms_hr1','ms_hr2']},
  {label:'Gray',         color:'#888898', ids:['ms_hr3','ms_hr4']},
  {label:'Purple',       color:'#9878c0', ids:['ms_pur1','ms_house','ms_lob']},
  {label:'Special',      color:'#333',    ids:['ms_demand']},
];

const AC={
  mgmt_trainee:   {n:'Mgmt Trainee',    c:'c-blk',isM:true, s:2, d:'Manager — slot +2',           t:['new_biz_dev','jvp','luxury_mgr']},
  jvp:            {n:'Junior VP',       c:'c-blk',isM:true, s:3, d:'Manager — slot +3',           t:['local_mgr','discount_mgr','vp','recruiting_mgr','coach']},
  vp:             {n:'Vice President',  c:'c-blk',isM:true, s:4, d:'Manager — slot +4',           t:['regional_mgr','svp','guru']},
  svp:            {n:'Senior VP',       c:'c-blk',isM:true, s:5, d:'Manager — slot +5',           t:['cfo','evp','hr_dir']},
  evp:            {n:'Exec VP',         c:'c-blk',isM:true, s:10,d:'Manager — slot +10',          t:[]},
  cfo:            {n:'CFO',             c:'c-pur', isM:false,s:0, d:'+50% cash this round',       t:[]},
  hr_dir:         {n:'HR Director',     c:'c-blk',isM:false,s:0, d:'4× hire or −$5',             t:[]},
  local_mgr:      {n:'Local Manager',   c:'c-red', isM:false,s:0, d:'New restaurant (soon)',      t:[]},
  regional_mgr:   {n:'Regional Mgr',    c:'c-red', isM:false,s:0, d:'Open/move restaurant',      t:[]},
  pricing_mgr:    {n:'Pricing Manager', c:'c-sal', isM:false,s:0, d:'Price −$1 (mandatory)',      t:[]},
  luxury_mgr:     {n:'Luxury Manager',  c:'c-sal', isM:false,s:0, d:'Price +$10',                t:[]},
  discount_mgr:   {n:'Discount Mgr',    c:'c-sal', isM:false,s:0, d:'Price −$3',                 t:[]},
  recruiting_girl:{n:'Recruiting Girl', c:'c-gry', isM:false,s:0, d:'+1 recruit (excl. CEO)',    t:[]},
  recruiting_mgr: {n:'Recruiting Mgr',  c:'c-gry', isM:false,s:0, d:'2× recruit or −$5',         t:[]},
  trainer:        {n:'Trainer',         c:'c-gry', isM:false,s:0, d:'Train 1 person +1 step',    t:[]},
  coach:          {n:'Coach',           c:'c-gry', isM:false,s:0, d:'Train up to 2 steps',       t:[]},
  guru:           {n:'Guru',            c:'c-gry', isM:false,s:0, d:'Train up to 3 steps',       t:[]},
  waitress:       {n:'Waitress',        c:'c-pur', isM:false,s:0, d:'$3 cash · win ties',        t:['movie_star']},
  movie_star:     {n:'Movie Star',      c:'c-pur', isM:false,s:0, d:'Win all ties · 1st order',  t:[]},
  night_shift:    {n:'Night Shift Mgr', c:'c-blk', isM:false,s:0, d:'No-salary staff ×2 · Trainer+1',t:[]},
  mkt_trainee:    {n:'Mkt Trainee',     c:'c-blu', isM:false,s:0, d:'Billboard dur.2',           t:['campaign_mgr','rural_mkt','mass_mkt','gourmet']},
  campaign_mgr:   {n:'Campaign Mgr',    c:'c-blu', isM:false,s:0, d:'Mailbox dur.3',             t:['brand_mgr']},
  brand_mgr:      {n:'Brand Manager',   c:'c-blu', isM:false,s:0, d:'Airplane dur.4',            t:['brand_dir']},
  brand_dir:      {n:'Brand Director',  c:'c-blu', isM:false,s:0, d:'Radio dur.5',               t:[]},
  rural_mkt:      {n:'Rural Mkteer',    c:'c-blu', isM:false,s:0, d:'Giant billboard · rural',   t:[]},
  mass_mkt:       {n:'Mass Mkteer',     c:'c-blu', isM:false,s:0, d:'Extra marketing phase',     t:[]},
  gourmet:        {n:'Gourmet Critic',  c:'c-blu', isM:false,s:0, d:'All gardens dur.3',         t:[]},
  errand_boy:     {n:'Errand Boy',      c:'c-lgrn',isM:false,s:0, d:'1 drink (any)',             t:['cart_operator']},
  cart_operator:  {n:'Cart Operator',   c:'c-lgrn',isM:false,s:0, d:'2 drinks/source',           t:['truck_driver']},
  truck_driver:   {n:'Truck Driver',    c:'c-lgrn',isM:false,s:0, d:'3 drinks/source',           t:['zeppelin']},
  zeppelin:       {n:'Zeppelin Pilot',  c:'c-lgrn',isM:false,s:0, d:'2 drinks · ignore roads',  t:[]},
  kitchen_trainee:{n:'Kitchen Trainee', c:'c-grn', isM:false,s:0, d:'1 burger or pizza',        t:['burger_cook','pizza_cook','sushi_cook','noodle_cook']},
  burger_cook:    {n:'Burger Cook',     c:'c-grn', isM:false,s:0, d:'3 burgers',                t:['burger_chef','fry_chef']},
  burger_chef:    {n:'Burger Chef',     c:'c-grn', isM:false,s:0, d:'8 burgers',                t:[]},
  pizza_cook:     {n:'Pizza Cook',      c:'c-grn', isM:false,s:0, d:'3 pizzas',                 t:['pizza_chef','fry_chef']},
  pizza_chef:     {n:'Pizza Chef',      c:'c-grn', isM:false,s:0, d:'8 pizzas',                 t:[]},
  kimchi_master:  {n:'Kimchi Master',   c:'c-grn', isM:false,s:0, d:'1 kimchi (cleanup)',       t:[]},
  sushi_cook:     {n:'Sushi Cook',      c:'c-grn', isM:false,s:0, d:'2 sushi',                  t:['sushi_chef','fry_chef']},
  sushi_chef:     {n:'Sushi Chef',      c:'c-grn', isM:false,s:0, d:'5 sushi',                  t:[]},
  noodle_cook:    {n:'Noodle Cook',     c:'c-grn', isM:false,s:0, d:'6 noodles',                t:['noodle_chef','fry_chef']},
  noodle_chef:    {n:'Noodle Chef',     c:'c-grn', isM:false,s:0, d:'16 noodles',               t:[]},
  fry_chef:       {n:'Fry Chef',        c:'c-grn', isM:false,s:0, d:'+$10 per sale',            t:[]},
  barista_trainee:{n:'Barista Trainee', c:'c-lblu',isM:false,s:0, d:'1 coffee',                 t:['barista']},
  barista:        {n:'Barista',         c:'c-lblu',isM:false,s:0, d:'2 coffee',                 t:['lead_barista']},
  lead_barista:   {n:'Lead Barista',    c:'c-lblu',isM:false,s:0, d:'5 coffee',                 t:[]},
  lobbyist:       {n:'Lobbyist',        c:'c-gry', isM:false,s:0, d:'Road or park',             t:[]},
  new_biz_dev:    {n:'New Biz Dev',     c:'c-gry', isM:false,s:0, d:'House or garden',          t:[]},
};

const HIRE_LIST=['mgmt_trainee','pricing_mgr','recruiting_girl','trainer','mkt_trainee','night_shift','errand_boy','kitchen_trainee','kimchi_master','waitress','barista_trainee','lobbyist'];

function cl(g){return JSON.parse(JSON.stringify(g));}
let msChecked={};
let G={turn:1,ceoSlots:[],managers:[],beach:[],trainedThis:{}};
let undoStack=[],turnSnaps=[{turn:1,state:cl(G),logs:[]}],curLogs=[],viewTurnNum=null;
let hireOpen=false,trainTarget=null,turnStartState=cl(G);

function houseMsOn(){return !!msChecked['ms_house'];}
function saveU(){undoStack.push(cl(G));}
function doUndo(){if(!undoStack.length)return;G=undoStack.pop();curLogs.shift();trainTarget=null;snap();ra();}
function snap(){const s={turn:G.turn,state:cl(G),logs:[...curLogs]};const i=turnSnaps.findIndex(x=>x.turn===G.turn);if(i>=0)turnSnaps[i]=s;else turnSnaps.push(s);}
function ceoOpen(){return Math.max(0,CEO_SLOTS-G.ceoSlots.filter(Boolean).length);}
function mgrOpen(i){const m=G.managers[i];if(!m)return 0;return Math.max(0,AC[m.id].s-m.staff.filter(Boolean).length);}
function awList(s){return [...s.ceoSlots.filter(Boolean),...s.managers.flatMap(m=>m.staff.filter(Boolean))];}
function calcTrain(s){const aw=awList(s);const ns=aw.includes('night_shift');let n=0;aw.forEach(id=>{if(id==='trainer')n+=ns?2:1;if(id==='coach')n+=2;if(id==='guru')n+=3;});return n;}
function calcRecruit(s){let n=1,e=0;awList(s).forEach(id=>{if(id==='recruiting_girl')e+=1;if(id==='recruiting_mgr')e+=2;});return{n,e,t:n+e};}
function addLog(t){curLogs.unshift(t);}

const MS_REWARDS={
  'ms_mkt1': ['kitchen_trainee','errand_boy'],
  'ms_hr4':  ['trainer'],
  'ms_hr3':  ['evp'],
};

function toggleMs(id){
  const wasChecked=!!msChecked[id];
  msChecked[id]=!wasChecked;
  const nowChecked=msChecked[id];
  const ms=MILESTONES.find(m=>m.id===id);
  const label=ms?ms.name:id;

  if(MS_REWARDS[id]){
    saveU();
    if(nowChecked){
      MS_REWARDS[id].forEach(cid=>{
        G.beach.push(cid);
        addLog('★ MS ✓ '+label+' → '+AC[cid].n+' เข้า Beach');
      });
    } else {
      MS_REWARDS[id].forEach(cid=>{
        const idx=G.beach.lastIndexOf(cid);
        if(idx!==-1){G.beach.splice(idx,1);addLog('★ MS ✗ '+label+' → '+AC[cid].n+' ออก Beach');}
      });
    }
    snap();
  } else {
    if(id==='ms_house')addLog(nowChecked?'★ MILESTONE ✓ First House Built':'★ MILESTONE ✗ First House Built');
  }
  renderMs();ra();
}
function doHire(id){saveU();G.beach.push(id);addLog('HIRE '+AC[id].n);snap();ra();}
function toggleHire(){hireOpen=!hireOpen;trainTarget=null;ra();}
function clickBeach(id){trainTarget=(trainTarget===id)?null:id;ra();}
function doTrain(from,to){
  if(calcTrain(G)===0){showModal('ไม่มี TRAINER','ต้องมี Trainer/Coach/Guru ใน Structure ก่อน');return;}
  if(!houseMsOn()&&G.trainedThis[from]){showModal('TRAIN ซ้ำไม่ได้','ต้องติ๊ก Milestone "First House Built" ก่อน');return;}
  saveU();G.beach.splice(G.beach.indexOf(from),1);G.beach.push(to);
  if(!houseMsOn())G.trainedThis[to]=true;
  addLog('TRAIN '+AC[from].n+' → '+AC[to].n);trainTarget=null;snap();ra();
}
function doPlace(bid){
  const c=AC[bid];let ok=false;
  if(c.isM&&c.s>0){if(G.ceoSlots.filter(Boolean).length<CEO_SLOTS){saveU();G.ceoSlots.push(bid);G.managers.push({id:bid,staff:[]});ok=true;}}
  else{if(ceoOpen()>0){saveU();G.ceoSlots.push(bid);ok=true;}else{for(let i=0;i<G.managers.length;i++){if(mgrOpen(i)>0){saveU();G.managers[i].staff.push(bid);ok=true;break;}}}}
  if(ok){G.beach.splice(G.beach.indexOf(bid),1);addLog(AC[bid].n+' → Structure');trainTarget=null;snap();ra();}
  else showModal('ไม่มี SLOT ว่าง','Hire Management Trainee เพื่อเพิ่ม slot ก่อน');
}
function removeFromStruct(type,idx,sub){
  saveU();let id;
  if(type==='ceo'){id=G.ceoSlots[idx];const c=AC[id];G.ceoSlots.splice(idx,1);if(c.isM&&c.s>0){const mi=G.managers.findIndex(m=>m.id===id);if(mi>=0){G.managers[mi].staff.filter(Boolean).forEach(s=>G.beach.push(s));G.managers.splice(mi,1);}}}
  else{id=G.managers[idx].staff[sub];G.managers[idx].staff.splice(sub,1);}
  G.beach.push(id);addLog(AC[id].n+' ← Beach');snap();ra();
}
function nextTurn(){snap();G.turn++;G.trainedThis={};undoStack=[];curLogs=[];turnSnaps.push({turn:G.turn,state:cl(G),logs:[]});turnStartState=cl(G);viewTurnNum=null;trainTarget=null;ra();}
function resetTurn(){if(!confirm('Reset Turn '+G.turn+'?'))return;G=cl(turnStartState);undoStack=[];curLogs=[];trainTarget=null;snap();ra();}
function viewTurn(t){viewTurnNum=(t===G.turn)?null:t;trainTarget=null;ra();}
function resetGame(){if(!confirm('Reset ทั้งเกม?'))return;G={turn:1,ceoSlots:[],managers:[],beach:[],trainedThis:{}};msChecked={};undoStack=[];curLogs=[];turnSnaps=[{turn:1,state:cl(G),logs:[]}];viewTurnNum=null;hireOpen=false;trainTarget=null;turnStartState=cl(G);ra();}
function getDS(){if(viewTurnNum!==null){const s=turnSnaps.find(x=>x.turn===viewTurnNum);if(s)return{state:s.state,logs:s.logs,ro:true};}return{state:G,logs:curLogs,ro:false};}
function ecard(id){const c=AC[id];return `<div class="ecard ${c.c}"><div class="ename">${c.n}</div><div class="esub">${c.d}</div></div>`;}

function renderMs(){
  let h='<div class="ms-grid">';
  MILESTONES.forEach(ms=>{
    const checked=!!msChecked[ms.id];const isH=ms.special==='house';
    h+=`<div class="ms-card ${ms.cls} ${checked?'checked':''} ${isH?'house-built':''}" onclick="toggleMs('${ms.id}')">
      <div class="ms-check">${checked?'✓':'✗'}</div>
      <div><div class="ms-name">${ms.name}</div>${ms.effect?`<div class="ms-effect">${ms.effect}</div>`:''}</div>
    </div>`;
  });
  h+='</div>';
  document.getElementById('ms-render').innerHTML=h;
}

function renderHist(){
  let h='<span class="hlbl">Turn:</span>';
  turnSnaps.forEach(s=>{const cur=s.turn===G.turn&&viewTurnNum===null;const view=s.turn===viewTurnNum;h+=`<button class="hbtn ${cur?'cur':view?'past':''}" onclick="viewTurn(${s.turn})">T${s.turn}</button>`;});
  document.getElementById('hist-bar').innerHTML=h;
}

function renderViewNotice(ro,t){
  const el=document.getElementById('view-notice');
  if(ro){el.style.display='flex';el.innerHTML=`<span>กำลังดู Turn ${t} — read only</span><button class="mbtn-sm" onclick="viewTurn(${G.turn})">กลับปัจจุบัน →</button>`;}
  else el.style.display='none';
}

function renderStruct(state,ro){
  let h='';
  for(let i=0;i<CEO_SLOTS;i++){const id=state.ceoSlots[i];if(id){h+=`<div class="slot filled ${ro?'':'removable'}" ${ro?'':('onclick="removeFromStruct(\'ceo\','+i+')"')}><span class="rmx">✕</span>${ecard(id)}</div>`;}else h+=`<div class="slot"><div class="slot-lbl">CEO<br>SLOT</div></div>`;}
  document.getElementById('ceo-row').innerHTML=h;
  let mh='';
  state.managers.forEach((mgr,mi)=>{
    const mc=AC[mgr.id];
    mh+=`<div class="mgr-box"><div class="mgr-head"><div style="width:90px;flex-shrink:0">${ecard(mgr.id)}</div><div class="mgr-info">→ CEO · ${mc.s} STAFF SLOTS</div></div><div class="mgr-slots">`;
    for(let si=0;si<mc.s;si++){const sid=mgr.staff[si];if(sid){mh+=`<div class="slot filled ${ro?'':'removable'}" style="width:78px;min-height:68px" ${ro?'':('onclick="removeFromStruct(\'staff\','+mi+','+si+')"')}><span class="rmx">✕</span>${ecard(sid)}</div>`;}else mh+=`<div class="slot" style="width:78px;min-height:68px"><div class="slot-lbl">STAFF</div></div>`;}
    mh+=`</div></div>`;
  });
  document.getElementById('mgr-area').innerHTML=mh;
}

function renderBeach(state,ro){
  const el=document.getElementById('beach-area');
  if(state.beach.length===0){el.innerHTML='<div style="font-size:10px;color:#bbb;font-family:Oswald,sans-serif;padding:8px 0">NO ONE AT THE BEACH</div>';document.getElementById('train-popup-area').innerHTML='';return;}
  const tSlots=calcTrain(state);
  el.innerHTML=state.beach.map(id=>{
    const c=AC[id];const isTgt=id===trainTarget;const hasTrain=c.t&&c.t.length>0;
    return `<div class="bc ${c.c}" style="${isTgt?'outline:2px solid #e05050;outline-offset:2px':''}">
      <div class="bc-name">${c.n}</div><div class="bc-sub">${c.d}</div>
      <div class="bc-btns">
        <button class="bc-btn" onclick="doPlace('${id}')">→ WORK</button>
        ${hasTrain&&tSlots>0&&!ro?`<button class="bc-btn ${isTgt?'act':''}" onclick="clickBeach('${id}')">TRAIN</button>`:''}
      </div>
    </div>`;
  }).join('');
  renderTrainPopup(state,ro);
}

function renderTrainPopup(state,ro){
  const el=document.getElementById('train-popup-area');
  if(!trainTarget||ro){el.innerHTML='';return;}
  const fc=AC[trainTarget];if(!fc||!fc.t||fc.t.length===0){el.innerHTML='';return;}
  const used=!houseMsOn()&&state.trainedThis[trainTarget];
  let h=`<div class="train-popup"><div class="tp-title">TRAIN: ${fc.n}</div>
    ${used?'<div style="font-size:10px;color:var(--red2);margin-bottom:7px">Train แล้วในรอบนี้ — ต้องติ๊ก "First House Built" ก่อน</div>':''}
    <div class="tp-grid">`;
  fc.t.forEach(tid=>{const tc=AC[tid];if(!tc)return;const dis=used;h+=`<div class="tp-card ${tc.c}" style="${dis?'opacity:.35;cursor:not-allowed':''}" ${dis?'':(`onclick="doTrain('${trainTarget}','${tid}')"`)}><div class="tp-name">${tc.n}</div><div class="tp-desc">${tc.d}</div></div>`;});
  h+=`</div><div class="tp-close" onclick="trainTarget=null;ra()">✕ ปิด</div></div>`;
  el.innerHTML=h;
}

function renderHirePanel(ro){
  const btn=document.getElementById('hire-open-btn');const lbl=document.getElementById('hire-btn-lbl');const area=document.getElementById('hire-panel-area');
  btn.className='hire-open-btn'+(hireOpen?' open':'');lbl.textContent=hireOpen?'ปิด ▴':'เลือกการ์ดที่ต้องการ Hire ▾';
  if(!hireOpen){area.innerHTML='';return;}
  let h='<div class="hire-panel"><div class="hire-grid">';
  HIRE_LIST.forEach(id=>{
    const c=AC[id];const tr=(c.t||[]).map(tid=>AC[tid]?AC[tid].n:tid).join(', ');
    h+=`<div class="hcard ${c.c}"><div class="hc-tag">${c.isM?'MANAGER':'STAFF'}</div><div class="hc-name">${c.n}</div><div class="hc-desc">${c.d}</div>${tr?`<div class="hc-train">→ ${tr}</div>`:'<div class="hc-train">hire only</div>'}<button class="hc-btn" onclick="doHire('${id}')">HIRE ►</button></div>`;
  });
  h+='</div></div>';area.innerHTML=h;
}

function renderLog(logs){
  document.getElementById('log-area').innerHTML=logs.length===0
    ?'<div class="log-item" style="color:#ccc">no actions yet</div>'
    :logs.slice(0,12).map(l=>`<div class="log-item">${l}</div>`).join('');
}

function updateChips(state){
  const tSlots=calcTrain(state);const rec=calcRecruit(state);
  let open=Math.max(0,CEO_SLOTS-state.ceoSlots.filter(Boolean).length);
  state.managers.forEach((m,i)=>open+=Math.max(0,AC[m.id].s-m.staff.filter(Boolean).length));
  const ns=awList(state).includes('night_shift');
  document.getElementById('tlabel').textContent='TURN '+G.turn+(viewTurnNum!==null?' · T'+viewTurnNum:'');
  document.getElementById('c-slots').textContent='SLOTS '+open;
  document.getElementById('c-beach').textContent='BEACH '+state.beach.length;
  document.getElementById('c-train').textContent='TRAIN '+tSlots+(ns?' ★':'');
  document.getElementById('c-recruit').textContent='RECRUIT '+rec.t+(rec.e>0?' (+'+rec.e+')':'');
  const hc=document.getElementById('c-house');hc.textContent=houseMsOn()?'HOUSE ✓':'HOUSE —';hc.className='chip'+(houseMsOn()?' hl':'');
  const ro=viewTurnNum!==null;
  document.getElementById('btn-undo').disabled=undoStack.length===0||ro;
  document.getElementById('btn-next').disabled=ro;
  document.getElementById('btn-rt').disabled=ro;
}

function showModal(title,body){
  document.getElementById('mc').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal"><h3>${title}</h3><p>${body}</p><div class="mact"><button class="mbtn dk" onclick="document.getElementById('mc').innerHTML=''">ปิด</button></div></div></div>`;
}
function closeModal(e){if(e.target.classList.contains('modal-bg'))document.getElementById('mc').innerHTML='';}

function ra(){const{state,logs,ro}=getDS();updateChips(state);renderHist();renderViewNotice(ro,viewTurnNum);renderStruct(state,ro);renderBeach(state,ro);renderHirePanel(ro);renderLog(logs);}

renderMs();ra();
</script>
</body>
</html>
