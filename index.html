<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Food Chain Magnate — Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* 50s Diner palette — matched to box art */
  --teal:#4a9da8;--teal2:#3a8a94;--teal3:#d4eff2;--teal4:#eaf7f8;
  --cream:#f7f2e2;--cream2:#ede5cc;--cream3:#d8ceb0;--cream4:#c4b898;
  --red:#c8392b;--red2:#e04030;--red3:#fde8e6;
  --navy:#1c2d4a;--navy2:#243660;--navy3:#c8d4e8;
  --chrome:#e8e4d8;--chrome2:#d0c8b0;
  --amber:#c87820;--amber2:#e8a030;--amber3:#fff3d4;
  /* card colours */
  --blk-bg:#1e2430;--blk-bd:#3a4460;--blk-tx:#e8eaf0;--blk-sx:rgba(232,234,240,.5);
  --sal-bg:#f0c8b0;--sal-bd:#c87860;--sal-tx:#3a0e08;
  --grn-bg:#7ab858;--grn-bd:#5a9840;--grn-tx:#0a2408;
  --lgrn-bg:#b0d8a0;--lgrn-bd:#6aaa58;--lgrn-tx:#082008;
  --blu-bg:#8ab8d8;--blu-bd:#5888b8;--blu-tx:#081428;
  --lblu-bg:#b8d8f0;--lblu-bd:#6aaad8;--lblu-tx:#081428;
  --pur-bg:#b088d8;--pur-bd:#7040b8;--pur-tx:#180828;
  --gry-bg:#d8d4cc;--gry-bd:#908878;--gry-tx:#1e1a14;
  --red-bg:#c83030;--red-bd:#a02020;--red-tx:#fff0ee;
}
html,body{background:#f5f0e8;color:var(--navy);font-family:'Source Sans 3',sans-serif;min-height:100vh;font-size:15px}
.app{max-width:600px;margin:0 auto;padding:0 0 80px}

/* ── TOPBAR — navy with chrome stripe ── */
.topbar{background:var(--navy);padding:0;position:sticky;top:0;z-index:50;
  border-bottom:3px solid var(--teal);
  box-shadow:0 2px 12px rgba(0,0,0,.35)}
.topbar-stripe{height:4px;background:repeating-linear-gradient(90deg,var(--teal) 0,var(--teal) 12px,var(--amber2) 12px,var(--amber2) 14px)}
.topbar-inner{padding:9px 14px}
.topbar-row1{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.logo{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;color:var(--chrome);letter-spacing:.07em;flex:1;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.logo em{color:var(--teal);font-style:normal;font-weight:700}
.tpill{background:var(--red);color:#fff;font-size:11px;font-weight:700;font-family:'Oswald',sans-serif;padding:4px 12px;border-radius:2px;letter-spacing:.08em;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.3);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.topbar-row2{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11px;padding:4px 10px;border-radius:2px;border:1px solid rgba(255,255,255,.15);color:rgba(232,234,240,.85);background:rgba(255,255,255,.08);white-space:nowrap;font-family:'Oswald',sans-serif;letter-spacing:.04em}
.chip.hl{border-color:var(--pur-bd);color:#d0a8f8;background:rgba(120,80,200,.2)}
.topbar-row3{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.tbtn{padding:7px 10px;border:1px solid rgba(255,255,255,.18);border-radius:3px;font-size:10px;font-family:'Oswald',sans-serif;letter-spacing:.06em;cursor:pointer;background:rgba(255,255,255,.08);color:rgba(232,234,240,.8);flex:1;min-width:60px;text-align:center;text-transform:uppercase;transition:all .12s}
.tbtn:active{background:rgba(255,255,255,.18)}
.tbtn:disabled{opacity:.3;cursor:not-allowed}
.tbtn.primary{background:var(--red);color:#fff;border-color:var(--red2);font-weight:600}
.tbtn.primary:active{background:var(--red2)}
.tbtn.warn{border-color:var(--amber);color:var(--amber2);background:rgba(200,120,30,.12)}

/* ── HIST BAR ── */
.hist-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 14px;background:var(--cream2);border-bottom:2px solid var(--teal);border-top:1px solid var(--cream3)}
.hlbl{font-size:9px;color:var(--teal2);text-transform:uppercase;letter-spacing:.12em;font-family:'Oswald',sans-serif;font-weight:600}
.hbtn{padding:4px 12px;border:1px solid var(--cream3);border-radius:2px;font-size:11px;font-family:'Oswald',sans-serif;cursor:pointer;background:#fff;color:#888;font-weight:500}
.hbtn.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.hbtn.past{background:var(--teal3);color:var(--teal2);border-color:var(--teal)}

/* ── PANELS ── */
.panel{background:#ffffff;padding:16px}
.panel.panel-alt{background:#f0ece0;}
.ptitle{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;color:var(--teal2);text-transform:uppercase;letter-spacing:.12em;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.pbar{width:4px;height:18px;border-radius:2px;background:var(--teal);flex-shrink:0}

/* ── VIEW NOTICE ── */
.view-notice{background:var(--teal3);border-bottom:2px solid var(--teal);padding:8px 14px;font-size:11px;color:var(--teal2);display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:'Oswald',sans-serif;letter-spacing:.04em}
.mbtn-sm{padding:5px 12px;border:1px solid var(--teal2);border-radius:3px;font-size:10px;font-family:'Oswald',sans-serif;cursor:pointer;background:var(--navy);color:#fff;letter-spacing:.05em;font-weight:600}

/* ── CEO CARD ── */
.ceo-card{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);border:2px solid var(--teal);border-radius:8px;padding:10px 20px;text-align:center;font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;color:#fff;letter-spacing:.08em;margin:0 auto 10px;max-width:200px;box-shadow:0 2px 10px rgba(28,45,74,.3)}
.ceo-sub{font-family:'Source Sans 3',sans-serif;font-size:9px;color:rgba(255,255,255,.45);margin-top:2px}
.ceo-arr{font-size:12px;color:var(--teal);text-align:center;margin-bottom:8px}

/* ── SLOTS ── */
.slots-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.slot{width:80px;min-height:72px;border:2px dashed var(--cream3);border-radius:7px;display:flex;align-items:center;justify-content:center;padding:4px;position:relative;background:var(--cream2)}
.slot.filled{border-style:solid;border-color:var(--chrome2);background:#fff}
.slot.removable{cursor:pointer}
.slot.removable:active{border-color:var(--red2);background:#fff5f5}
.slot.removable:hover .rmx{display:block}
.slot-lbl{font-size:10px;color:#bbb;text-align:center;font-family:'Oswald',sans-serif;letter-spacing:.04em}
.rmx{position:absolute;top:3px;right:5px;font-size:12px;color:var(--red);display:none;font-weight:700}

/* ── MGR BOX ── */
.mgr-box{border:1.5px solid var(--teal3);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--teal4)}
.mgr-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.mgr-info{font-size:9px;color:var(--teal2);font-family:'Oswald',sans-serif;letter-spacing:.04em;font-weight:500}
.mgr-slots{display:flex;gap:6px;flex-wrap:wrap}

/* ── EMPLOYEE CARDS ── */
.ecard{width:100%;border-radius:5px;padding:5px;text-align:center;border:1.5px solid transparent}
.ename{font-size:11px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.05em;line-height:1.3;text-transform:uppercase}
.esub{font-size:9px;line-height:1.3;margin-top:2px}
.c-blk{background:var(--blk-bg);border-color:var(--blk-bd);color:var(--blk-tx)}.c-blk .esub{color:var(--blk-sx)}
.c-sal{background:var(--sal-bg);border-color:var(--sal-bd);color:var(--sal-tx)}
.c-grn{background:var(--grn-bg);border-color:var(--grn-bd);color:var(--grn-tx)}
.c-lgrn{background:var(--lgrn-bg);border-color:var(--lgrn-bd);color:var(--lgrn-tx)}
.c-blu{background:var(--blu-bg);border-color:var(--blu-bd);color:var(--blu-tx)}
.c-lblu{background:var(--lblu-bg);border-color:var(--lblu-bd);color:var(--lblu-tx)}
.c-pur{background:var(--pur-bg);border-color:var(--pur-bd);color:var(--pur-tx)}
.c-gry{background:var(--gry-bg);border-color:var(--gry-bd);color:var(--gry-tx)}
.c-red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red-tx)}

/* ── BEACH CARDS ── */
.beach-wrap{display:flex;gap:7px;flex-wrap:wrap;min-height:40px}
.bc-remove{position:absolute;top:3px;right:4px;width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.25);background:rgba(255,255,255,.5);font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.5);font-weight:700;line-height:1;padding:0}
.bc-remove:active{background:rgba(200,50,50,.3);color:#c83030}
.bc{border-radius:8px;padding:8px 9px;font-family:'Oswald',sans-serif;text-align:center;border:1.5px solid transparent;display:flex;flex-direction:column;gap:3px;min-width:90px;cursor:default;box-shadow:0 1px 4px rgba(0,0,0,.1);position:relative}
.bc-name{font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.bc-sub{font-size:10px;opacity:.85;font-family:'Source Sans 3',sans-serif;text-transform:none;font-weight:400}
.bc-btns{display:flex;gap:4px;margin-top:5px;justify-content:center}
.bc-btn{padding:4px 9px;font-size:9px;font-family:'Oswald',sans-serif;cursor:pointer;border:1px solid rgba(0,0,0,.2);border-radius:3px;background:rgba(255,255,255,.38);color:inherit;min-height:32px;font-weight:600;letter-spacing:.04em}
.bc-btn:active{background:rgba(255,255,255,.65)}
.bc-btn.act{background:rgba(0,0,0,.22)}

/* ── TRAIN POPUP ── */
.train-popup{background:#fff;border:2px solid var(--teal);border-radius:9px;padding:12px;margin-top:9px;box-shadow:0 4px 18px rgba(74,157,168,.2)}
.tp-title{font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;margin-bottom:8px;color:var(--navy);letter-spacing:.06em}
.tp-grid{display:flex;gap:7px;flex-wrap:wrap}
.tp-card{border-radius:7px;padding:9px 10px;cursor:pointer;text-align:center;min-width:90px;border:1.5px solid transparent;flex:1;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tp-card:active{filter:brightness(1.08)}
.tp-name{font-family:'Oswald',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;line-height:1.25}
.tp-desc{font-size:8px;opacity:.8;margin-top:2px}
.tp-close{margin-top:9px;padding:7px 14px;border:1.5px solid var(--cream3);border-radius:4px;font-size:10px;font-family:'Oswald',sans-serif;cursor:pointer;background:var(--cream2);color:#888;display:block;width:100%;text-align:center;letter-spacing:.06em;font-weight:600}

/* ── HIRE BUTTON ── */
.hire-open-btn{width:100%;padding:13px;border:2px solid var(--teal);border-radius:7px;font-size:12px;font-family:'Oswald',sans-serif;letter-spacing:.08em;cursor:pointer;background:var(--teal4);color:var(--teal2);display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;font-weight:700;text-transform:uppercase;transition:all .15s}
.hire-open-btn .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);flex-shrink:0}
.hire-open-btn.open{background:var(--navy);color:#fff;border-color:var(--teal)}
.hire-open-btn.open .dot{background:var(--teal)}
.hire-panel{background:var(--cream2);border:1.5px solid var(--cream3);border-radius:8px;padding:10px;margin-top:8px}
.hire-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}
.hcard{border-radius:8px;padding:10px 9px;border:1.5px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hcard:active{filter:brightness(1.06)}
.hc-tag{display:inline-block;font-size:8px;padding:2px 6px;border-radius:2px;margin-bottom:4px;font-family:'Oswald',sans-serif;text-transform:uppercase;background:rgba(0,0,0,.14);color:inherit;opacity:.8;font-weight:600}
.hc-name{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;line-height:1.25;margin-bottom:3px}
.hc-desc{font-size:11px;line-height:1.4;opacity:.85}
.hc-train{font-size:10px;opacity:.6;margin-top:3px;font-style:italic}
.hc-btn{margin-top:8px;width:100%;padding:8px;border:1.5px solid rgba(0,0,0,.2);border-radius:4px;font-size:10px;font-family:'Oswald',sans-serif;cursor:pointer;background:rgba(0,0,0,.15);color:inherit;min-height:40px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.hc-btn:active{background:rgba(0,0,0,.28)}

/* ── MILESTONES ── */
.ms-grid{display:flex;gap:6px;flex-wrap:wrap}
.ms-card{border-radius:7px;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:7px;border:1.5px solid transparent;min-height:44px;box-shadow:0 1px 4px rgba(0,0,0,.08);transition:filter .1s}
.ms-card:active{filter:brightness(1.06)}
.ms-check{width:20px;height:20px;border-radius:3px;border:1.5px solid rgba(0,0,0,.25);background:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;font-weight:700}
.ms-card.checked .ms-check{background:rgba(0,0,0,.25)}
.ms-name{font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.3}
.ms-effect{font-size:10px;opacity:.8;margin-top:2px;font-family:'Source Sans 3',sans-serif}
.ms-blu{background:var(--blu-bg);border-color:var(--blu-bd);color:var(--blu-tx)}
.ms-grn{background:var(--grn-bg);border-color:var(--grn-bd);color:var(--grn-tx)}
.ms-red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red-tx)}
.ms-gry{background:var(--gry-bg);border-color:var(--gry-bd);color:var(--gry-tx)}
.ms-pur{background:var(--pur-bg);border-color:var(--pur-bd);color:var(--pur-tx)}
.ms-blk{background:var(--blk-bg);border-color:var(--blk-bd);color:var(--blk-tx)}
.ms-card.house-built.checked{box-shadow:0 0 0 2px var(--pur-bd)}

/* ── LOGO HEADER ── */
.logo-header{background:linear-gradient(180deg,#1c2d4a 0%,#243660 100%);padding:18px 14px 14px;text-align:center;border-bottom:4px solid var(--teal)}
.logo-header svg{display:block;margin:0 auto;max-width:280px;width:90%}
.logo-tagline{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:.18em;color:rgba(200,210,230,.5);margin-top:6px;text-transform:uppercase}

/* ── CARD ICON ── */
.hc-icon{font-size:28px;display:block;text-align:center;margin-bottom:5px;line-height:1}.hc-icon svg{width:32px;height:32px}
.bc-icon{font-size:20px;display:block;text-align:center;margin-bottom:2px;line-height:1}.bc-icon svg{width:24px;height:24px}
.ecard-icon{font-size:16px;display:block;text-align:center;margin-bottom:2px;line-height:1}.ecard-icon svg{width:20px;height:20px}
.tp-icon{font-size:18px;display:block;text-align:center;margin-bottom:3px;line-height:1}.tp-icon svg{width:22px;height:22px}

/* ── DINER DIVIDER — checkerboard signature element ── */
.diner-divider{height:12px;background:repeating-linear-gradient(
  90deg,
  var(--teal) 0px, var(--teal) 12px,
  var(--cream) 12px, var(--cream) 24px
);}

/* ── LOG ── */
.log-wrap{border-top:1px solid var(--cream3);padding-top:8px;margin-top:8px}
.log-item{font-size:11px;color:#666;padding:4px 0;border-bottom:1px solid var(--cream3);font-family:'Source Sans 3',sans-serif}
.log-item:last-child{border-bottom:none}
.sep{font-size:8px;color:#aaa;margin:5px 0 2px;line-height:1.5}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(28,45,74,.55);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:0}
.modal{background:#fff;border-radius:14px 14px 0 0;padding:20px 18px;width:100%;max-width:600px;border-top:3px solid var(--teal)}
.modal h3{font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;margin-bottom:7px;text-transform:uppercase;color:var(--navy);letter-spacing:.06em}
.modal p{font-size:12px;color:#666;line-height:1.6;margin-bottom:14px}
.mact{display:flex;gap:8px;justify-content:flex-end}
.mbtn{padding:8px 16px;border:1.5px solid var(--cream3);border-radius:4px;font-size:11px;font-family:'Oswald',sans-serif;cursor:pointer;background:var(--cream2);color:#777;min-height:44px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.mbtn.dk{background:var(--navy);color:#fff;border-color:var(--navy)}
</style>

</head>
<body>
<div class="app" id="app">

<!-- LOGO HEADER -->
<div class="logo-header">
  <svg viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
    <!-- Chrome lines top -->
    <line x1="10" y1="6" x2="270" y2="6" stroke="#4a9da8" stroke-width="1.5"/>
    <line x1="10" y1="9" x2="270" y2="9" stroke="rgba(74,157,168,.35)" stroke-width="0.8"/>
    <!-- FOOD CHAIN text -->
    <text x="140" y="36" font-family="Oswald,sans-serif" font-weight="700" font-size="28" fill="#e8eaf0" text-anchor="middle" letter-spacing="3">FOOD CHAIN</text>
    <!-- Red highlight under FOOD CHAIN -->
    <rect x="60" y="38" width="160" height="2" fill="#c8392b" rx="1"/>
    <!-- Magnate script-style text -->
    <text x="140" y="58" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#4a9da8" text-anchor="middle" letter-spacing="1">Magnate</text>
    <!-- SPECIAL EDITION badge -->
    <rect x="88" y="63" width="104" height="12" rx="6" fill="none" stroke="rgba(74,157,168,.5)" stroke-width="1"/>
    <text x="140" y="72.5" font-family="Oswald,sans-serif" font-size="7.5" fill="rgba(200,210,230,.6)" text-anchor="middle" letter-spacing="2.5">SPECIAL EDITION</text>
    <!-- Stars -->
    <text x="83" y="72.5" font-size="7" fill="#c8392b" text-anchor="middle">✦</text>
    <text x="197" y="72.5" font-size="7" fill="#c8392b" text-anchor="middle">✦</text>
    <!-- Chrome lines bottom -->
    <line x1="10" y1="79" x2="270" y2="79" stroke="rgba(74,157,168,.35)" stroke-width="0.8"/>
  </svg>
  <div class="logo-tagline">Sandbox Planner</div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-stripe"></div>
  <div class="topbar-inner">
  <div class="topbar-row1">
    <div class="tpill" id="tlabel">TURN 1</div>
  </div>
  <div class="topbar-row2">
    <div class="chip" id="c-slots">SLOTS 3</div>
    <div class="chip" id="c-beach">BEACH 0</div>
    <div class="chip" id="c-train">TRAIN 0</div>
    <div class="chip" id="c-recruit">RECRUIT 1</div>
    <div class="chip" id="c-house">HOUSE —</div>
  </div>
  <div class="topbar-row3">
    <button class="tbtn" id="btn-undo" onclick="doUndo()" disabled>↩ UNDO</button>
    <button class="tbtn warn" id="btn-rt" onclick="resetTurn()">↺ RESET TURN</button>
    <button class="tbtn primary" id="btn-next" onclick="nextTurn()">NEXT TURN →</button>
    <button class="tbtn" onclick="resetGame()">RESET ALL</button>
  </div>
  </div><!-- end topbar-inner -->
</div>

<!-- HISTORY -->
<div class="hist-bar" id="hist-bar"><span class="hlbl">Turn:</span></div>

<!-- VIEW NOTICE -->
<div id="view-notice" style="display:none"></div>

<!-- CORPORATE STRUCTURE -->
<div class="panel" id="interact-wrap">
  <div class="ptitle"><span class="pbar"></span>CORPORATE STRUCTURE</div>
  <div class="ceo-card">CEO — YOU<div class="ceo-sub">3 SLOTS · RECRUIT 1</div></div>
  <div class="ceo-arr">▼</div>
  <div class="slots-row" id="ceo-row"></div>
  <div id="mgr-area"></div>
  <div class="sep">CEO รับ 3 การ์ด — แตะการ์ดค้างเพื่อนำกลับ Beach</div>
</div>

<!-- AT THE BEACH + HIRE -->

function cl(g){return JSON.parse(JSON.stringify(g));}
let msChecked={};
let G={turn:1,ceoSlots:[],managers:[],beach:[],trainedThis:{},hiredCount:0,usedTrainSlots:0};
let undoStack=[],turnSnaps=[{turn:1,state:cl(G),logs:[]}],curLogs=[],viewTurnNum=null;
let hireOpen=false,trainTarget=null,turnStartState=cl(G);

function houseMsOn(){return !!msChecked['ms_house'];}
function saveU(){undoStack.push(cl(G));}
function doUndo(){if(!undoStack.length)return;G=undoStack.pop();curLogs.shift();trainTarget=null;snap();ra();}
function snap(){const s={turn:G.turn,state:cl(G),logs:[...curLogs]};const i=turnSnaps.findIndex(x=>x.turn===G.turn);if(i>=0)turnSnaps[i]=s;else turnSnaps.push(s);}
function ceoOpen(){return Math.max(0,CEO_SLOTS-G.ceoSlots.filter(Boolean).length);}
function mgrOpen(i){const m=G.managers[i];if(!m)return 0;return Math.max(0,AC[m.id].s-m.staff.filter(Boolean).length);}
function awList(s){return [...s.ceoSlots.filter(Boolean),...s.managers.flatMap(m=>m.staff.filter(Boolean))];}
function calcTrain(s){
  const aw=awList(s);
  const ns=aw.includes('night_shift');
  const trainerCount=aw.filter(id=>id==='trainer').length;
  let n=0;
  aw.forEach(id=>{
    if(id==='trainer') n+= ns ? 2 : 1;  /* Night Shift → Trainer แต่ละคน +1 extra */
    if(id==='coach')   n+=2;
    if(id==='guru')    n+=3;
  });
  return n;
}
function calcRecruit(s){
  const aw=awList(s);
  const ns=aw.includes('night_shift');
  const girlCount=aw.filter(id=>id==='recruiting_girl').length;
  const mgrCount=aw.filter(id=>id==='recruiting_mgr').length;
  const ceo=1; /* CEO base — Night Shift ไม่ +1 ให้ CEO */
  let extra=0;
  extra+=girlCount * (ns ? 2 : 1);   /* Recruiting Girl: ปกติ+1, ถ้ามี Night Shift +2 ต่อคน */
  extra+=mgrCount * 2;                 /* Recruiting Mgr: +2 ต่อคน */
  return{n:ceo,e:extra,t:ceo+extra};
}
function addLog(t){curLogs.unshift(t);}

const MS_REWARDS={
  'ms_mkt1': ['kitchen_trainee','errand_boy'],
  'ms_hr4':  ['trainer'],
  'ms_hr3':  ['evp'],
};

function toggleMs(id){
  const wasChecked=!!msChecked[id];
  msChecked[id]=!wasChecked;
  const nowChecked=msChecked[id];
  const ms=MILESTONES.find(m=>m.id===id);
  const label=ms?ms.name:id;

  if(MS_REWARDS[id]){
    saveU();
    if(nowChecked){
      MS_REWARDS[id].forEach(cid=>{
        G.beach.push(cid);
        addLog('★ MS ✓ '+label+' → '+AC[cid].n+' เข้า Beach');
      });
    } else {
      MS_REWARDS[id].forEach(cid=>{
        const idx=G.beach.lastIndexOf(cid);
        if(idx!==-1){G.beach.splice(idx,1);addLog('★ MS ✗ '+label+' → '+AC[cid].n+' ออก Beach');}
      });
    }
    snap();
  } else {
    if(id==='ms_house')addLog(nowChecked?'★ MILESTONE ✓ First House Built':'★ MILESTONE ✗ First House Built');
  }
  renderMs();ra();
}
/* auto-tick milestone when certain cards first enter Structure at work */
const AUTO_MS={
  'trainer':        'ms_hr4',   /* First Trainer Used */
  'recruiting_girl':'ms_hr3',   /* First Recruiting Girl Used */
  'mkt_trainee':    'ms_mkt1',  /* First Marketeer Used */
};
function autoMilestone(id){
  if(G.turn!==2)return; /* เฉพาะ Turn 2 เท่านั้น */
  const msId=AUTO_MS[id];
  if(!msId)return;
  if(msChecked[msId])return;
  msChecked[msId]=true;
  const ms=MILESTONES.find(m=>m.id===msId);
  const label=ms?ms.name:msId;
  if(MS_REWARDS[msId]){
    MS_REWARDS[msId].forEach(cid=>{
      G.beach.push(cid);
      addLog('★ MS AUTO ✓ '+label+' → '+AC[cid].n+' เข้า Beach');
    });
  } else {
    addLog('★ MS AUTO ✓ '+label);
  }
  renderMs();
}

/* จำนวน Hire ที่ใช้ไปแล้วใน turn นี้ */
function hiredThisTurn(){return G.hiredCount||0;}
function trainedThisTurn(){return Object.keys(G.trainedThis||{}).length;}

function doHire(id){
  const recLimit=calcRecruit(G).t;
  const used=hiredThisTurn();
  if(used>=recLimit){
    showModal('RECRUIT เต็มแล้ว','Turn นี้ Hire ได้ '+recLimit+' คน (ใช้ไป '+used+' คน) — ต้องมี Recruiting Girl/Mgr เพิ่มก่อน');
    return;
  }
  saveU();
  G.beach.push(id);
  G.hiredCount=(G.hiredCount||0)+1;
  addLog('HIRE '+AC[id].n+' ('+G.hiredCount+'/'+recLimit+')');
  snap();ra();
}

function removeFromBeach(idx){
  saveU();
  const id=G.beach[idx];
  G.beach.splice(idx,1);
  /* คืน hire count ด้วย */
  if(G.hiredCount>0)G.hiredCount--;
  addLog('คืน '+AC[id].n+' ← ออกจาก Beach');
  trainTarget=null;snap();ra();
}
function toggleHire(){hireOpen=!hireOpen;trainTarget=null;ra();}
function clickBeach(id){trainTarget=(trainTarget===id)?null:id;ra();}
function doTrain(from,to){
  const tSlots=calcTrain(G);
  if(tSlots===0){showModal('ไม่มี TRAINER','ต้องมี Trainer/Coach/Guru ใน Structure ก่อน');return;}
  /* นับ train actions ที่ใช้ไปใน turn นี้ */
  const usedSlots=G.usedTrainSlots||0;
  if(usedSlots>=tSlots){
    showModal('TRAIN เต็มแล้ว','Turn นี้ Train ได้ '+tSlots+' slot (ใช้ไป '+usedSlots+') — ต้องมี Coach/Guru/Night Shift Mgr เพิ่ม');
    return;
  }
  if(!houseMsOn()&&G.trainedThis[from]){showModal('TRAIN ซ้ำไม่ได้','ต้องติ๊ก Milestone "First House Built" ก่อน');return;}
  saveU();
  G.beach.splice(G.beach.indexOf(from),1);G.beach.push(to);
  if(!houseMsOn())G.trainedThis[to]=true;
  G.usedTrainSlots=(G.usedTrainSlots||0)+1;
  addLog('TRAIN '+AC[from].n+' → '+AC[to].n+' ('+(G.usedTrainSlots)+'/'+tSlots+')');
  trainTarget=null;snap();ra();
}
function doPlace(bid){
  const c=AC[bid];let ok=false;
  if(c.isM&&c.s>0){if(G.ceoSlots.filter(Boolean).length<CEO_SLOTS){saveU();G.ceoSlots.push(bid);G.managers.push({id:bid,staff:[]});ok=true;}}
  else{if(ceoOpen()>0){saveU();G.ceoSlots.push(bid);ok=true;}else{for(let i=0;i<G.managers.length;i++){if(mgrOpen(i)>0){saveU();G.managers[i].staff.push(bid);ok=true;break;}}}}
  if(ok){G.beach.splice(G.beach.indexOf(bid),1);addLog(AC[bid].n+' → Structure');autoMilestone(bid);trainTarget=null;snap();ra();}
  else showModal('ไม่มี SLOT ว่าง','Hire Management Trainee เพื่อเพิ่ม slot ก่อน');
}
function removeFromStruct(type,idx,sub){
  saveU();let id;
  if(type==='ceo'){id=G.ceoSlots[idx];const c=AC[id];G.ceoSlots.splice(idx,1);if(c.isM&&c.s>0){const mi=G.managers.findIndex(m=>m.id===id);if(mi>=0){G.managers[mi].staff.filter(Boolean).forEach(s=>G.beach.push(s));G.managers.splice(mi,1);}}}
  else{id=G.managers[idx].staff[sub];G.managers[idx].staff.splice(sub,1);}
  G.beach.push(id);addLog(AC[id].n+' ← Beach');snap();ra();
}
function nextTurn(){
  /* บันทึก state ล่าสุดของ turn ปัจจุบัน */
  snap();
  const nextT=G.turn+1;
  /* ถ้า turn ถัดไปมี snapshot อยู่แล้ว → โหลดมาต่อ */
  const existing=turnSnaps.find(s=>s.turn===nextT);
  if(existing){
    G=cl(existing.state);G.turn=nextT;
    curLogs=[...existing.logs];
  } else {
    /* สร้าง turn ใหม่ carry state ต่อจากปัจจุบัน */
    G={turn:nextT,ceoSlots:cl(G.ceoSlots),managers:cl(G.managers),beach:cl(G.beach),trainedThis:{},hiredCount:0,usedTrainSlots:0};
    curLogs=[];
    turnSnaps.push({turn:nextT,state:cl(G),logs:[]});
  }
  undoStack=[];turnStartState=cl(G);trainTarget=null;ra();
}
function resetTurn(){
  if(!confirm('Reset Turn '+G.turn+'?'))return;
  G=cl(turnStartState);undoStack=[];curLogs=[];trainTarget=null;snap();ra();
}
/* กด turn ใดก็ได้ → โหลด state ของ turn นั้นมาแก้ ไม่กระทบ turn อื่น */
function viewTurn(t){
  if(t===G.turn){ra();return;}
  /* บันทึก state ปัจจุบันก่อนออก */
  snap();
  const snap_t=turnSnaps.find(s=>s.turn===t);
  if(!snap_t){alert('ไม่พบข้อมูล Turn '+t);return;}
  G=cl(snap_t.state);G.turn=t;
  curLogs=[...snap_t.logs];
  undoStack=[];trainTarget=null;hireOpen=false;
  turnStartState=cl(snap_t.state);
  ra();
}
function resetGame(){
  if(!confirm('Reset ทั้งเกม?'))return;
  G={turn:1,ceoSlots:[],managers:[],beach:[],trainedThis:{},hiredCount:0,usedTrainSlots:0};
  msChecked={};undoStack=[];curLogs=[];
  turnSnaps=[{turn:1,state:cl(G),logs:[]}];
  hireOpen=false;trainTarget=null;turnStartState=cl(G);ra();
}
function getDS(){return{state:G,logs:curLogs,ro:false};}
function ecard(id){const c=AC[id];return `<div class="ecard ${c.c}"><span class="ecard-icon">${icon(id)}</span><div class="ename">${c.n}</div><div class="esub">${c.d}</div></div>`;}

function renderMs(){
  let h='<div class="ms-grid">';
  MILESTONES.forEach(ms=>{
    const checked=!!msChecked[ms.id];const isH=ms.special==='house';
    h+=`<div class="ms-card ${ms.cls} ${checked?'checked':''} ${isH?'house-built':''}" onclick="toggleMs('${ms.id}')">
      <div class="ms-check">${checked?'✓':'✗'}</div>
      <div><div class="ms-name">${ms.name}</div>${ms.effect?`<div class="ms-effect">${ms.effect}</div>`:''}</div>
    </div>`;
  });
  h+='</div>';
  document.getElementById('ms-render').innerHTML=h;
}

function renderHist(){
  let h='<span class="hlbl">Turn:</span>';
  turnSnaps.forEach(s=>{
    const cur=s.turn===G.turn;
    h+=`<button class="hbtn ${cur?'cur':''}" onclick="viewTurn(${s.turn})">${cur?'▶ ':''}T${s.turn}</button>`;
  });
  document.getElementById('hist-bar').innerHTML=h;
}

function renderViewNotice(ro,t){
  // ro ไม่ได้ใช้แล้ว — แสดง turn ปัจจุบันที่กำลังแก้
  const el=document.getElementById('view-notice');
  el.style.display='none';
}

function renderStruct(state,ro){
  let h='';
  for(let i=0;i<CEO_SLOTS;i++){const id=state.ceoSlots[i];if(id){h+=`<div class="slot filled ${ro?'':'removable'}" ${ro?'':('onclick="removeFromStruct(\'ceo\','+i+')"')}><span class="rmx">✕</span>${ecard(id)}</div>`;}else h+=`<div class="slot"><div class="slot-lbl">CEO<br>SLOT</div></div>`;}
  document.getElementById('ceo-row').innerHTML=h;
  let mh='';
  state.managers.forEach((mgr,mi)=>{
    const mc=AC[mgr.id];
    mh+=`<div class="mgr-box"><div class="mgr-head"><div style="width:90px;flex-shrink:0">${ecard(mgr.id)}</div><div class="mgr-info">→ CEO · ${mc.s} STAFF SLOTS</div></div><div class="mgr-slots">`;
    for(let si=0;si<mc.s;si++){const sid=mgr.staff[si];if(sid){mh+=`<div class="slot filled ${ro?'':'removable'}" style="width:78px;min-height:68px" ${ro?'':('onclick="removeFromStruct(\'staff\','+mi+','+si+')"')}><span class="rmx">✕</span>${ecard(sid)}</div>`;}else mh+=`<div class="slot" style="width:78px;min-height:68px"><div class="slot-lbl">STAFF</div></div>`;}
    mh+=`</div></div>`;
  });
  document.getElementById('mgr-area').innerHTML=mh;
}

function renderBeach(state,ro){
  const el=document.getElementById('beach-area');
  if(state.beach.length===0){el.innerHTML='<div style="font-size:10px;color:#bbb;font-family:Oswald,sans-serif;padding:8px 0">NO ONE AT THE BEACH</div>';document.getElementById('train-popup-area').innerHTML='';return;}
  const tSlots=calcTrain(state);
  el.innerHTML=state.beach.map((id,bi)=>{
    const c=AC[id];const isTgt=id===trainTarget;const hasTrain=c.t&&c.t.length>0;
    return `<div class="bc ${c.c}" style="${isTgt?'outline:2px solid #e05050;outline-offset:2px':''}">
      <button class="bc-remove" onclick="removeFromBeach(${bi})" title="คืนการ์ด">✕</button>
      <span class="bc-icon">${icon(id)}</span>
      <div class="bc-name">${c.n}</div><div class="bc-sub">${c.d}</div>
      <div class="bc-btns">
        <button class="bc-btn" onclick="doPlace('${id}')">→ WORK</button>
        ${hasTrain&&tSlots>0&&!ro?`<button class="bc-btn ${isTgt?'act':''}" onclick="clickBeach('${id}')">TRAIN</button>`:''}
      </div>
    </div>`;
  }).join('');
  renderTrainPopup(state,ro);
}

function renderTrainPopup(state,ro){
  const el=document.getElementById('train-popup-area');
  if(!trainTarget||ro){el.innerHTML='';return;}
  const fc=AC[trainTarget];if(!fc||!fc.t||fc.t.length===0){el.innerHTML='';return;}
  const used=!houseMsOn()&&state.trainedThis[trainTarget];
  let h=`<div class="train-popup"><div class="tp-title">TRAIN: ${fc.n}</div>
    ${used?'<div style="font-size:10px;color:var(--red2);margin-bottom:7px">Train แล้วในรอบนี้ — ต้องติ๊ก "First House Built" ก่อน</div>':''}
    <div class="tp-grid">`;
  fc.t.forEach(tid=>{const tc=AC[tid];if(!tc)return;const dis=used;h+=`<div class="tp-card ${tc.c}" style="${dis?'opacity:.35;cursor:not-allowed':''}" ${dis?'':(`onclick="doTrain('${trainTarget}','${tid}')"`)}><span class="tp-icon">${icon(tid)}</span><div class="tp-name">${tc.n}</div><div class="tp-desc">${tc.d}</div></div>`;});
  h+=`</div><div class="tp-close" onclick="trainTarget=null;ra()">✕ ปิด</div></div>`;
  el.innerHTML=h;
}

function renderHirePanel(ro){
  const btn=document.getElementById('hire-open-btn');const lbl=document.getElementById('hire-btn-lbl');const area=document.getElementById('hire-panel-area');
  btn.className='hire-open-btn'+(hireOpen?' open':'');lbl.textContent=hireOpen?'ปิด ▴':'เลือกการ์ดที่ต้องการ Hire ▾';
  if(!hireOpen){area.innerHTML='';return;}
  let h='<div class="hire-panel"><div class="hire-grid">';
  HIRE_LIST.forEach(id=>{
    const c=AC[id];const tr=(c.t||[]).map(tid=>AC[tid]?AC[tid].n:tid).join(', ');
    h+=`<div class="hcard ${c.c}">
      <span class="hc-icon">${icon(id)}</span>
      <div class="hc-tag">${c.isM?'MANAGER':'STAFF'}</div>
      <div class="hc-name">${c.n}</div>
      <div class="hc-desc">${c.d}</div>
      ${tr?`<div class="hc-train">→ ${tr}</div>`:'<div class="hc-train">hire only</div>'}
      <button class="hc-btn" onclick="doHire('${id}')">HIRE ►</button>
    </div>`;
  });
  h+='</div></div>';area.innerHTML=h;
}

function renderLog(logs){
  document.getElementById('log-area').innerHTML=logs.length===0
    ?'<div class="log-item" style="color:#ccc">no actions yet</div>'
    :logs.slice(0,12).map(l=>`<div class="log-item">${l}</div>`).join('');
}

function updateChips(state){
  const tSlots=calcTrain(state);const rec=calcRecruit(state);
  let open=Math.max(0,CEO_SLOTS-state.ceoSlots.filter(Boolean).length);
  state.managers.forEach((m,i)=>open+=Math.max(0,AC[m.id].s-m.staff.filter(Boolean).length));
  const ns=awList(state).includes('night_shift');
  const recUsed=G.hiredCount||0;
  const trainUsed=G.usedTrainSlots||0;
  const recLabel=rec.t>0?`RECRUIT ${recUsed}/${rec.t}`:'RECRUIT 0';
  const trainLabel=tSlots>0?`TRAIN ${trainUsed}/${tSlots}${ns?' ★':''}`:`TRAIN 0`;
  document.getElementById('tlabel').textContent='TURN '+G.turn;
  document.getElementById('c-slots').textContent='SLOTS '+open;
  document.getElementById('c-beach').textContent='BEACH '+state.beach.length;
  document.getElementById('c-train').textContent=trainLabel;
  document.getElementById('c-recruit').textContent=recLabel;
  const hc=document.getElementById('c-house');hc.textContent=houseMsOn()?'HOUSE ✓':'HOUSE —';hc.className='chip'+(houseMsOn()?' hl':'');
  document.getElementById('btn-undo').disabled=undoStack.length===0;
  document.getElementById('btn-next').disabled=false;
  document.getElementById('btn-rt').disabled=false;
}

function showModal(title,body){
  document.getElementById('mc').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal"><h3>${title}</h3><p>${body}</p><div class="mact"><button class="mbtn dk" onclick="document.getElementById('mc').innerHTML=''">ปิด</button></div></div></div>`;
}
function closeModal(e){if(e.target.classList.contains('modal-bg'))document.getElementById('mc').innerHTML='';}

function ra(){
  const{state,logs,ro}=getDS();
  updateChips(state);renderHist();renderViewNotice(ro,null);
  renderStruct(state,false);renderBeach(state,false);renderHirePanel(false);renderLog(logs);
}

renderMs();ra();
</script>
</body>
</html>
